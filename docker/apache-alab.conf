# Docroot em `web/`, não na raiz do projeto.
#
# 🔴 Isto é segurança, não organização. Na raiz ficam `.env` (com as salts),
# `config/` e `vendor/`. Apontar o docroot para lá publicaria as três coisas.

ServerName alab-blog
ServerTokens Prod
ServerSignature Off

<VirtualHost *:PORTA_DO_RAILWAY>
    DocumentRoot /app/web

    <Directory /app/web>
        Options -Indexes +FollowSymLinks
        # Regras no vhost em vez de .htaccess: o Apache não precisa procurar
        # arquivo por diretório a cada requisição.
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # xmlrpc é superfície de ataque clássica (amplificação de brute force e
    # pingback) e nada aqui usa: não há Jetpack nem publicação por app.
    <Files "xmlrpc.php">
        Require all denied
    </Files>

    # Defesa em profundidade: o arquivo SQLite mora em /data, fora do docroot.
    # Se algum dia alguém apontar DB_DIR para dentro de web/, isto segura.
    <FilesMatch "\.(sqlite|sqlite3|ht.*)$">
        Require all denied
    </FilesMatch>

    # O TLS termina antes de chegar aqui (Railway, e a Vercel na frente).
    # Quem traduz X-Forwarded-Proto é o `config/application.php`, que já vem do
    # Bedrock — não repetir aqui, para não ter duas fontes de verdade.

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
